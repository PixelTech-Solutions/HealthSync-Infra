name: Terraform CI/CD

on:
  push:
    branches: ["chanidu-dev"]

  pull_request:

  workflow_dispatch:   # manual destroy trigger

# -------------------------
# REQUIRED FOR OIDC LOGIN
# -------------------------
permissions:
  id-token: write
  contents: read

jobs:

# -------------------------
# PLAN
# -------------------------
  validate-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          auth-type: OIDC

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan


# -------------------------
# APPLY (MANUAL APPROVAL)
# -------------------------
  apply:
    name: Apply (Manual Approval)
    runs-on: ubuntu-latest
    needs: validate-plan

    environment:
      name: production   # requires approval in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          auth-type: OIDC

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


# -------------------------
# DESTROY (MANUAL + SAFE)
# -------------------------
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch'

    environment:
      name: production   # requires approval before destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          auth-type: OIDC

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve