name: Terraform CI/CD

on:
  push:
    branches: [ "chanidu-dev" ]
  pull_request:
  workflow_dispatch:   # 👈 allows manual destroy trigger

jobs:

# -------------------------
# PLAN
# -------------------------
  validate-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan


# -------------------------
# APPLY (MANUAL APPROVAL)
# -------------------------
  apply:
    name: Apply (Manual)
    runs-on: ubuntu-latest
    needs: validate-plan

    environment:
      name: production   # 👈 add required reviewers in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }} 
          tenant-id: ${{ secrets.ARM_TENANT_ID }} 
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }} 
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply tfplan


# -------------------------
# DESTROY (MANUAL + DANGEROUS)
# -------------------------
  destroy:
    name: Destroy Infrastructure (Manual)
    runs-on: ubuntu-latest

    # 👇 only runs when manually triggered
    if: github.event_name == 'workflow_dispatch'

    environment:
      name: production   # 👈 require approval before destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve