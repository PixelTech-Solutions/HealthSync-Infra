# =============================================================================
# ShopEase Infrastructure — Dev Environment
# =============================================================================
# State key:  shopease/shopease/dev/terraform.tfstate
# Var file:   environments/dev.tfvars
# =============================================================================

name: "Deploy HealthSync Infra - Dev"

on:
  push:
    branches: [chanidu-dev]
    paths: ["infra/**"]
  pull_request:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write


jobs:
  dev:
    uses: PixelTech-Solutions/Terraform/.github/workflows/terraform.yml@main
    with:
      working_directory: ./infra/healthsync
      environment: dev
      project_name: healthsync
      service_name: healthsync-chanidu
    secrets: inherit